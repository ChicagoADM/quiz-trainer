<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажер тестирования</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .quiz-container { max-width: 800px; margin: 2rem auto; }
    .card { border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
    .correct { color: #198754; }
    .incorrect { color: #dc3545; }
    .card.bg-light.border-success {
  border-left: 5px solid #198754 !important;
}
.card.bg-light.border-danger {
  border-left: 5px solid #dc3545 !important;
}
.list-group-item-success {
  font-weight: 500;
}
  </style>
</head>
<body>
  <div class="quiz-container">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
